name: nanocode
version: 0.2.2
description: Experimental branded circular visual codes, generated and read locally through Rust FFI.
homepage: https://github.com/NikGariel/nanocode
repository: https://github.com/NikGariel/nanocode
publish_to: none
environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'
dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
