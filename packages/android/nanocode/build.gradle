plugins { id 'com.android.library'; id 'maven-publish' }
android {
    namespace 'dev.nanocode'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        minSdk 23
        consumerProguardFiles 'consumer-rules.pro'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    publishing { singleVariant('release') { withSourcesJar() } }
}
afterEvaluate {
    publishing {
        publications { release(MavenPublication) {
            from components.release
            groupId = 'dev.nanocode'; artifactId = 'nanocode'; version = '0.2.2'
            pom { name = 'NanoCode'; description = 'Circular visual code generator and reader'; url = 'https://github.com/NikGariel/nanocode'
                licenses { license { name = 'MIT'; url = 'https://opensource.org/license/mit' } }
            }
        } }
        repositories { maven { url = uri("${rootProject.projectDir}/../../artifacts/maven") } }
    }
}
