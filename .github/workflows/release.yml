name: Release artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to rebuild
        required: true
        default: v0.2.2
        type: string
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - run: node scripts/check-version.mjs
      - run: node -e 'if (process.env.RELEASE_TAG !== "v" + require("./package.json").version) process.exit(1)'
  native:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
          - {os: windows-2022, target: x86_64-pc-windows-msvc}
          - {os: macos-15, target: aarch64-apple-darwin}
          - {os: macos-15-intel, target: x86_64-apple-darwin}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --locked --workspace --release --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - run: python scripts/package-native.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: artifacts/native
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: artifacts/*.tar.gz
          if-no-files-found: error
  web:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: rustup target add wasm32-unknown-unknown
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node scripts/check-site.mjs && node scripts/test-package.mjs
      - run: mkdir -p artifacts && npm pack --workspace @nikgariel/nanocode --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: archive-web
          path: artifacts/*.tgz
  apple:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
      - run: sh scripts/build-apple.sh
      - run: swift test --package-path packages/apple
      - uses: actions/upload-artifact@v4
        with:
          name: archive-apple
          path: artifacts/nanocode-apple.zip
  android:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-35"'
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
      - run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" sh scripts/build-android.sh
      - run: gradle -p packages/android :nanocode:assembleRelease :nanocode:publish
      - run: python scripts/package-android.py
      - uses: actions/upload-artifact@v4
        with:
          name: android-libs
          path: artifacts/android
      - uses: actions/upload-artifact@v4
        with:
          name: archive-android
          path: |
            artifacts/nanocode-android.aar
            artifacts/nanocode-maven.zip
  flutter:
    needs: [native, apple, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: artifacts/native
      - uses: actions/download-artifact@v4
        with:
          name: archive-apple
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: android-libs
          path: artifacts/android
      - run: unzip artifacts/nanocode-apple.zip -d artifacts/apple-package
      - run: git clone --depth 1 --branch 3.38.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
      - run: echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
        working-directory: packages/flutter
      - run: dart analyze lib
        working-directory: packages/flutter
      - run: python scripts/package-flutter.py x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: archive-flutter
          path: artifacts/nanocode-flutter-x86_64.tar.gz
  draft-release:
    needs: [web, native, apple, android, flutter]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: release
      - run: python scripts/checksums.py release
      - name: Create reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" release/* --draft --verify-tag --title "NanoCode $RELEASE_TAG" --notes-file .github/release-notes.md
